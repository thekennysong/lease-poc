openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Double Lease Capitalization API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: leases
    description: Lease capitalization operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /leases:
    get:
      operationId: listLeases
      tags: [leases]
      summary: List all leases
      responses:
        "200":
          description: List of leases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Lease"
    post:
      operationId: createLease
      tags: [leases]
      summary: Create a new lease
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeaseInput"
      responses:
        "201":
          description: Created lease
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lease"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /leases/summary:
    get:
      operationId: getLeasesSummary
      tags: [leases]
      summary: Get aggregate summary stats for all leases
      parameters:
        - name: fiscalYearStartMonth
          in: query
          required: false
          description: Override the fiscal year start month (1-12) for YTD calcs. Falls back to app settings.
          schema:
            type: integer
            minimum: 1
            maximum: 12
      responses:
        "200":
          description: Summary stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeasesSummary"

  /leases/{id}:
    get:
      operationId: getLease
      tags: [leases]
      summary: Get a lease with its full amortization schedule
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Lease with schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaseWithSchedule"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateLease
      tags: [leases]
      summary: Update a lease
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeaseUpdate"
      responses:
        "200":
          description: Updated lease
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lease"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteLease
      tags: [leases]
      summary: Delete a lease
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /leases/{id}/schedule:
    get:
      operationId: getLeaseSchedule
      tags: [leases]
      summary: Get amortization schedule entries for a lease
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Schedule entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScheduleEntry"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /leases/{id}/schedule/post:
    post:
      operationId: postLeasePayments
      tags: [leases]
      summary: Post (approve) payments for a lease through a given period
      description: |
        Flips draft schedule entries through `throughPeriod` to "posted" and
        generates a balanced journal entry per period. Idempotent — already
        posted periods are skipped, not duplicated.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostPaymentsInput"
      responses:
        "200":
          description: Updated schedule entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScheduleEntry"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /leases/{id}/schedule/unpost/{periodNumber}:
    post:
      operationId: unpostLeasePayment
      tags: [leases]
      summary: Reverse a previously posted period
      description: |
        Marks the posted JE for that period as "reversed", creates a new
        offsetting "posted" JE with debits/credits flipped, and flips the
        schedule entry back to "draft".
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: periodNumber
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Updated schedule entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScheduleEntry"
        "400":
          description: Period is not currently posted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Lease or period not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /leases/{id}/journal-entries:
    get:
      operationId: getLeaseJournalEntries
      tags: [leases]
      summary: List all journal entries (posted and reversed) for a lease
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Journal entries with their lines, ordered by postedAt asc
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JournalEntry"
        "404":
          description: Lease not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    Lease:
      type: object
      required:
        - id
        - name
        - lessor
        - commencementDate
        - termMonths
        - monthlyPayment
        - presentValue
        - borrowingRate
        - leaseClassification
        - status
        - createdAt
      properties:
        id:
          type: integer
        name:
          type: string
        lessor:
          type: string
        commencementDate:
          type: string
          format: date
        termMonths:
          type: integer
        monthlyPayment:
          type: number
        presentValue:
          type: number
        borrowingRate:
          type: number
          description: Annual incremental borrowing rate as percentage (e.g. 6 for 6%)
        leaseClassification:
          type: string
          enum: [operating, finance]
          description: ASC 842 lease classification
        rouAssetAccount:
          type: ["string", "null"]
        leaseLiabilityAccount:
          type: ["string", "null"]
        interestExpenseAccount:
          type: ["string", "null"]
        amortizationExpenseAccount:
          type: ["string", "null"]
        cashAccount:
          type: ["string", "null"]
        paymentFrequency:
          type: string
          enum: [monthly, quarterly, annually]
        paymentTiming:
          type: string
          enum: [advance, arrears]
          description: Whether payments are made at period-start (advance) or period-end (arrears)
        isShortTerm:
          type: boolean
          description: ASC 842 short-term lease exemption (term ≤ 12 months); skips schedule generation
        prepaidRent:
          type: number
          description: Added to opening ROU asset
        initialDirectCosts:
          type: number
          description: Added to opening ROU asset
        leaseIncentives:
          type: number
          description: Subtracted from opening ROU asset
        openingRouAsset:
          type: number
          description: Computed = presentValue + prepaidRent + initialDirectCosts − leaseIncentives
        status:
          type: string
          enum: [draft, active, expired]
        currentBalance:
          type: ["number", "null"]
        nextPayment:
          type: ["number", "null"]
        nextPaymentDate:
          type: ["string", "null"]
          format: date
        createdAt:
          type: string
          format: date-time

    LeaseInput:
      type: object
      required:
        - name
        - lessor
        - commencementDate
        - termMonths
        - monthlyPayment
        - presentValue
        - borrowingRate
      properties:
        name:
          type: string
          minLength: 1
        lessor:
          type: string
          minLength: 1
        commencementDate:
          type: string
          format: date
        termMonths:
          type: integer
          minimum: 1
        monthlyPayment:
          type: number
          minimum: 0
        presentValue:
          type: number
          minimum: 0
        borrowingRate:
          type: number
          minimum: 0
        leaseClassification:
          type: string
          enum: [operating, finance]
        rouAssetAccount:
          type: string
        leaseLiabilityAccount:
          type: string
        interestExpenseAccount:
          type: string
        amortizationExpenseAccount:
          type: string
        cashAccount:
          type: string
        paymentFrequency:
          type: string
          enum: [monthly, quarterly, annually]
        paymentTiming:
          type: string
          enum: [advance, arrears]
        isShortTerm:
          type: boolean
        prepaidRent:
          type: number
          minimum: 0
        initialDirectCosts:
          type: number
          minimum: 0
        leaseIncentives:
          type: number
          minimum: 0

    LeaseUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        lessor:
          type: string
        commencementDate:
          type: string
          format: date
        termMonths:
          type: integer
          minimum: 1
        monthlyPayment:
          type: number
          minimum: 0
        presentValue:
          type: number
          minimum: 0
        borrowingRate:
          type: number
          minimum: 0
        leaseClassification:
          type: string
          enum: [operating, finance]
        rouAssetAccount:
          type: string
        leaseLiabilityAccount:
          type: string
        interestExpenseAccount:
          type: string
        amortizationExpenseAccount:
          type: string
        cashAccount:
          type: string
        paymentFrequency:
          type: string
          enum: [monthly, quarterly, annually]
        paymentTiming:
          type: string
          enum: [advance, arrears]
        isShortTerm:
          type: boolean
        prepaidRent:
          type: number
          minimum: 0
        initialDirectCosts:
          type: number
          minimum: 0
        leaseIncentives:
          type: number
          minimum: 0
        status:
          type: string
          enum: [draft, active, expired]

    LeaseWithSchedule:
      type: object
      required:
        - id
        - name
        - lessor
        - commencementDate
        - termMonths
        - monthlyPayment
        - presentValue
        - borrowingRate
        - leaseClassification
        - status
        - createdAt
        - schedule
      properties:
        id:
          type: integer
        name:
          type: string
        lessor:
          type: string
        commencementDate:
          type: string
          format: date
        termMonths:
          type: integer
        monthlyPayment:
          type: number
        presentValue:
          type: number
        borrowingRate:
          type: number
        leaseClassification:
          type: string
          enum: [operating, finance]
        rouAssetAccount:
          type: ["string", "null"]
        leaseLiabilityAccount:
          type: ["string", "null"]
        interestExpenseAccount:
          type: ["string", "null"]
        amortizationExpenseAccount:
          type: ["string", "null"]
        cashAccount:
          type: ["string", "null"]
        paymentFrequency:
          type: string
          enum: [monthly, quarterly, annually]
        paymentTiming:
          type: string
          enum: [advance, arrears]
        isShortTerm:
          type: boolean
        prepaidRent:
          type: number
        initialDirectCosts:
          type: number
        leaseIncentives:
          type: number
        openingRouAsset:
          type: number
        status:
          type: string
          enum: [draft, active, expired]
        currentBalance:
          type: ["number", "null"]
        nextPayment:
          type: ["number", "null"]
        nextPaymentDate:
          type: ["string", "null"]
          format: date
        createdAt:
          type: string
          format: date-time
        schedule:
          type: array
          items:
            $ref: "#/components/schemas/ScheduleEntry"

    ScheduleEntry:
      type: object
      required:
        - id
        - leaseId
        - periodNumber
        - paymentDate
        - beginningBalance
        - payment
        - interest
        - principal
        - endingBalance
        - rouAmortization
        - leaseExpense
        - status
      properties:
        id:
          type: integer
        leaseId:
          type: integer
        periodNumber:
          type: integer
        paymentDate:
          type: string
          format: date
        beginningBalance:
          type: number
        payment:
          type: number
        interest:
          type: number
        principal:
          type: number
        endingBalance:
          type: number
        rouAmortization:
          type: number
        leaseExpense:
          type: number
          description: Persisted P&L expense for the period — straight-line lease expense for operating leases, interest+ROU amortization for finance leases.
        status:
          type: string
          enum: [draft, posted]

    PostPaymentsInput:
      type: object
      required:
        - throughPeriod
      properties:
        throughPeriod:
          type: integer
          minimum: 1
          description: Post all draft payments up through this period number

    JournalEntryLine:
      type: object
      required:
        - id
        - journalEntryId
        - accountCode
        - debit
        - credit
      properties:
        id:
          type: integer
        journalEntryId:
          type: integer
        accountCode:
          type: string
        debit:
          type: number
        credit:
          type: number
        memo:
          type: ["string", "null"]

    JournalEntry:
      type: object
      required:
        - id
        - leaseId
        - scheduleEntryId
        - period
        - postedAt
        - status
        - idempotencyKey
        - lines
      properties:
        id:
          type: integer
        leaseId:
          type: integer
        scheduleEntryId:
          type: integer
        period:
          type: string
          description: YYYY-MM period label
        postedAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [posted, reversed]
        idempotencyKey:
          type: string
        reversesEntryId:
          type: ["integer", "null"]
          description: When set, this JE is the offsetting reversal of that original entry
        memo:
          type: ["string", "null"]
        lines:
          type: array
          items:
            $ref: "#/components/schemas/JournalEntryLine"

    LeasesSummary:
      type: object
      required:
        - activeLeases
        - interestExpenseYtd
        - outstandingLeaseLiability
      properties:
        activeLeases:
          type: integer
        interestExpenseYtd:
          type: number
        outstandingLeaseLiability:
          type: number
